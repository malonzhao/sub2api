name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api
          git fetch upstream
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "chore: sync with upstream"
          git push origin main
