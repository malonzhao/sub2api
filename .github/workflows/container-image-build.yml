name: Publish GHCR image

on:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Prepare the hacked files
        id: prepare
        run: |
          cp -r "./hacked/frontend" "."
          sed -i "s/欢迎使用/欢迎来到/g" "./frontend/src/i18n/locales/zh/misc.ts"
          sed -i "s/10, 20, /20, /g" frontend/src/components/payment/AmountInput.vue frontend/src/views/user/PaymentView.vue

          sed -i "s/CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'/CLAUDE_CODE_ATTRIBUTION_HEADER: '0'\,\n    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'/g" frontend/src/components/keys/UseKeyModal.vue
          sed -i "s/export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/export CLAUDE_CODE_ATTRIBUTION_HEADER=0\nexport CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/g" frontend/src/components/keys/UseKeyModal.vue
          sed -i "s/set CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/set CLAUDE_CODE_ATTRIBUTION_HEADER=0\nset CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/g" frontend/src/components/keys/UseKeyModal.vue
          sed -i "s/\$env:CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/\$env:CLAUDE_CODE_ATTRIBUTION_HEADER=0\n\$env:CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1/g" frontend/src/components/keys/UseKeyModal.vue
          sed -i 's/"CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"/"CLAUDE_CODE_ATTRIBUTION_HEADER": "0"\,\n    "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"/g' frontend/src/components/keys/UseKeyModal.vue
          sed -i "s/sub2api/bytetensor/g" frontend/src/components/keys/UseKeyModal.vue

          grep -rl "Sub2API" "./frontend" | xargs sed -i "s/Sub2API/ByteTensor/g"
          grep -rl "SUB2API_API_KEY" "./frontend" | xargs sed -i "s/SUB2API_API_KEY/BYTETENSOR_KEY/g"
          grep -rl "sub2_" "./backend/internal/service" | xargs sed -i "s/sub2_/mo_/g"

      - name: Resolved version
        id: version
        run: |
          VERSION="$(cat ./backend/cmd/server/VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hacked-${{ matrix.arch }}
          cache-to: type=gha,scope=hacked-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Docker Image Digest (${{ matrix.arch }})"
            echo '```'
            echo "${REGISTRY_IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge manifest
    needs:
      - build_single_arch
    runs-on: ubuntu-latest

    permissions:
      packages: write

    env:
      VERSION: ${{ needs.build_single_arch.outputs.version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -ne 2 ]; then
            echo "::error::Expected 2 digests, found ${count}"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${VERSION}" \
            -t "${REGISTRY_IMAGE}:latest" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Image summary
        run: |
          {
            echo "### Docker Image Manifest"
            echo '```'
            docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
